<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVR Code Lab Questions · Ms Syeda Tuition</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#16233a;font:16px/1.5 system-ui,sans-serif}header{background:#14253c;color:white;padding:20px max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:23px}header span{font-size:14px;color:#bbd1e8}main{max-width:1080px;margin:30px auto;padding:0 20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}h1{font-size:28px;margin:0}p{margin:8px 0}select,button{font:inherit}select{padding:10px;border:1px solid #bcc8d7;border-radius:9px;background:white;max-width:100%}.progress{height:6px;background:#d7e0ec;border-radius:4px;margin:18px 0}.progress div{height:100%;background:#147a70;border-radius:4px}.paper{background:white;border:1px solid #d2dce8;border-radius:16px;padding:28px;box-shadow:0 8px 25px #15284008}.eyebrow{font-size:14px;font-weight:700;color:#58708e;text-transform:uppercase;letter-spacing:1px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;margin-top:25px}.examples{border-right:2px dashed #d6dfe9;padding-right:26px}.example{display:flex;align-items:center;gap:22px;padding:6px 12px}.code{font-size:24px;font-weight:700;letter-spacing:5px;font-family:monospace}.figure{width:112px;height:96px;display:block;flex-shrink:0}.target{display:flex;justify-content:center;align-items:center;gap:24px;background:#f4f7fb;border-radius:12px;margin:12px 0 25px;padding:20px}.target .figure{width:150px;height:125px}.options{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}button{border:1px solid #b8c9db;background:#fff;border-radius:9px;padding:12px;cursor:pointer;color:#172b43}button:hover{border-color:#147a70;background:#effaf7}button:focus-visible,select:focus-visible{outline:3px solid #df9c25;outline-offset:3px}.option{padding:12px 3px;font-weight:700;font-size:20px}.option small{display:block;font-size:12px;color:#678098;font-weight:500;margin-bottom:4px}.option.selected{background:#e5f3ff;border:2px solid #2868aa}.option.correct{background:#e0f5e8;border:2px solid #24814e}.option.wrong{background:#fff0ed;border:2px solid #bd553a}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.primary{background:#147a70;color:white;border-color:#147a70;font-weight:700}.primary:hover{background:#11675f;color:white}button:disabled{opacity:.45;cursor:default}.feedback{margin-top:20px;padding:18px;background:#f1f7fb;border-radius:12px}.feedback h2{font-size:20px;margin:0 0 8px}.hint{font-size:15px;color:#4d6480;margin-top:15px}footer{font-size:14px;color:#65788e;margin:22px 0}.summary{text-align:center;padding:35px} .summary strong{font-size:58px;color:#147a70;display:block}@media(max-width:700px){header{padding:15px 20px}header span{display:none}main{margin:20px auto}.top{align-items:flex-start;flex-direction:column}.paper{padding:18px}.layout{grid-template-columns:1fr;gap:20px}.examples{border-right:0;border-bottom:2px dashed #d6dfe9;padding:0 0 15px;display:grid;grid-template-columns:1fr 1fr}.example{padding:3px;gap:5px}.figure{width:85px;height:76px}.code{font-size:22px;letter-spacing:3px}.options{gap:5px}.target{margin-bottom:15px}h1{font-size:24px}}
</style></head><body><header><strong>NVR / Code Lab</strong><span>11+ · original picture coding practice</span></header><main><div class="top"><div><div class="eyebrow">Crack the picture code</div><h1>Two letters. Two clues.</h1></div><label>Practice set <select id="filter"><option value="all">Mixed practice · 41 questions</option><option value="hard">Difficult · 5 questions</option><option value="0">Shape & shading</option><option value="1">Direction & shading</option><option value="2">Shape & dots</option><option value="3">Outer & inner shapes</option><option value="4">Direction & dots</option><option value="5">Shape & line direction</option></select></label></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="difficult" style="background:#14253c;color:white">Difficult · 5 questions</button><div id="hard-nav" style="display:flex;gap:7px;flex-wrap:wrap"></div></div><div class="progress"><div id="bar"></div></div><section class="paper" id="app"></section><footer>Original practice questions, inspired by common 11+ coding formats. Codes change in every question. No account needed.</footer></main><script>
const types=['Shape & shading','Direction & shading','Shape & dots','Outer & inner shapes','Direction & dots','Shape & line direction'];
const names=[['circle','square','triangle'],['outline','solid black','striped'],['up','right','down'],['one dot','two dots','three dots'],['horizontal line','vertical line','diagonal line']];
function shape(n,cx=60,cy=48,size=25,fill='white'){const attrs=`fill="${fill}" stroke="#111" stroke-width="2.8"`;return n===0?`<circle cx="${cx}" cy="${cy}" r="${size}" ${attrs}/>`:n===1?`<rect x="${cx-size}" y="${cy-size}" width="${size*2}" height="${size*2}" ${attrs}/>`:`<polygon points="${cx},${cy-size} ${cx+size},${cy+size} ${cx-size},${cy+size}" ${attrs}/>`}
function figure(type,a,b,uid){const shade=b===0?'white':b===1?'#111':`url(#stripe${uid})`;let body='';if(type===0)body=shape(a,60,48,28,shade);if(type===1||type===4){body=`<g transform="rotate(${a*90} 60 48)"><path d="M60 15 L87 43 H73 V79 H47 V43 H33 Z" fill="${type===1?shade:'white'}" stroke="#111" stroke-width="2.8"/></g>`;}if(type===2)body=shape(a,60,40,24);if(type===2||type===4){for(let i=0;i<=b;i++)body+=`<circle cx="${60-b*9+i*18}" cy="88" r="4" fill="#111"/>`;}if(type===3)body=shape(a,60,48,35)+shape(b,60,48,12,'#111');if(type===5){body=shape(a,60,48,29);const lines=['40,48 80,48','60,29 60,67','43,65 77,31'];body+=`<polyline points="${lines[b]}" stroke="#111" stroke-width="3"/>`;}return `<svg class="figure" viewBox="0 0 120 100" role="img" aria-label="${description(type,a,b)}"><defs><pattern id="stripe${uid}" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="white"/><path d="M0 7L7 0" stroke="#111" stroke-width="2"/></pattern></defs>${body}</svg>`;}
function description(t,a,b){return [names[0][a]+'; '+names[1][b],names[2][a]+' arrow; '+names[1][b],names[0][a]+'; '+names[3][b],names[0][a]+' outside; '+names[0][b]+' inside',names[2][a]+' arrow; '+names[3][b],names[0][a]+'; '+names[4][b]][t]}
const bank=Array.from({length:36},(_,i)=>{let t=i%6,seed=Math.floor(i/6),alphabet='BCDFGHJKLMNPQRSTVWXYZ',offset=(i*7)%alphabet.length,letters=Array.from({length:6},(_,j)=>alphabet[(offset+j)%alphabet.length]),swap=seed%2===1;const code=(a,b)=>swap?letters[3+b]+letters[a]:letters[a]+letters[3+b];const a=seed%2?2:1,b=seed%3?2:1;let ex=b===2?[[0,0],[0,2],[1,0],[2,1]]:[[0,0],[0,1],[1,0],[2,2]];if(a===2&&b===2)ex=[[0,0],[0,2],[1,0],[2,1]];let correct=code(a,b),options=[correct,code(a,(b+1)%3),code((a+1)%3,b),correct.split('').reverse().join(''),code((a+2)%3,(b+2)%3)];options=options.map((x,j)=>({x,k:(j*11+i*7)%17})).sort((u,v)=>u.k-v.k).map(x=>x.x);return {t,a,b,ex,code,correct,options,letters,swap};});

const hardSpecs=[
{title:'Shaded satellite',fa:['circle outline','square outline','triangle outline'],fb:['top satellite filled','right satellite filled','bottom satellite filled'],swap:false},
{title:'Shape inside a frame',fa:['small circle','small square','small triangle'],fb:['top-left corner','top-right corner','bottom-right corner'],swap:true},
{title:'Arrow and shaded bands',fa:['arrow pointing up','arrow pointing right','arrow pointing down'],fb:['top band filled','middle band filled','bottom band filled'],swap:false},
{title:'Counting shaded tiles',fa:['one filled tile','two filled tiles','three filled tiles'],fb:['arrow pointing up','arrow pointing right','arrow pointing down'],swap:true},
{title:'Nested direction',fa:['circle outside','square outside','triangle outside'],fb:['inner arrow pointing up','inner arrow pointing right','inner arrow pointing down'],swap:true}
];
hardSpecs.forEach((spec,i)=>{const letters=['K','R','T','D','H','M'].map((_,j)=>'BCDFGHJKLMNPQRSTVWXYZ'[(i*3+j)%20]);let code=(a,b)=>spec.swap?letters[3+b]+letters[a]:letters[a]+letters[3+b];const a=2,b=2,correct=code(a,b);let options=[correct,code(2,1),code(1,2),code(0,2),correct.split('').reverse().join('')];options.splice((i+1)%5,0,options.shift());bank.push({...spec,hard:true,hardType:i,t:6,a,b,letters,code,correct,options,ex:[[0,0],[1,1],[0,2],[2,1]]});});
function arrow(x,y,size,dir){return `<g transform="translate(${x} ${y}) rotate(${dir*90}) scale(${size/30})"><path d="M0 -24L18 -4H8V23H-8V-4H-18Z" fill="white" stroke="#111" stroke-width="3"/></g>`;}
function hardFigure(q,a,b,uid){let body='';switch(q.hardType){case 0:body=shape(a,60,48,22);[[60,12],[99,48],[60,84],[21,48]].forEach(([x,y],i)=>body+=`<circle cx="${x}" cy="${y}" r="6" stroke="#111" stroke-width="2" fill="${i===b?'#111':'white'}"/>`);break;
case 1:body='<rect x="19" y="8" width="82" height="82" fill="white" stroke="#111" stroke-width="2.8"/>';[[36,25],[84,25],[84,73],[36,73]].forEach(([x,y],i)=>body+=i===b?shape(a,x,y,10,'#111'):`<circle cx="${x}" cy="${y}" r="2" fill="#111"/>`);break;
case 2:body=arrow(32,49,28,a);for(let j=0;j<3;j++)body+=`<rect x="72" y="${18+j*22}" width="28" height="17" fill="${j===b?'#111':'white'}" stroke="#111" stroke-width="2"/>`;break;
case 3:body=arrow(93,48,22,b);for(let j=0;j<4;j++)body+=`<rect x="${17+(j%2)*24}" y="${25+Math.floor(j/2)*24}" width="19" height="19" fill="${j<=a?'#111':'white'}" stroke="#111" stroke-width="2"/>`;break;
case 4:body=shape(a,60,49,38)+arrow(60,52,15,b);break;}
return `<svg class="figure" viewBox="0 0 120 100" role="img" aria-label="${q.fa[a]}; ${q.fb[b]}">${body}</svg>`;}
function hardExplanation(q){return `<p><b>${q.swap?'Second':'First'} letter:</b> ${q.fa.map((v,i)=>`${q.letters[i]} = ${v}`).join('; ')}.</p><p><b>${q.swap?'First':'Second'} letter:</b> ${q.fb.map((v,i)=>`${q.letters[i+3]} = ${v}`).join('; ')}.</p><p>Compare examples 1 and 3: their first feature stays the same, so the changing letter codes the second feature. Examples 2 and 4 share their second feature, revealing the other letter.</p><p>The target has <b>${q.fa[q.a]}</b> and <b>${q.fb[q.b]}</b>. Its code is <b>${q.correct}</b>.</p>`;}
function renderHardNav(){const nav=document.getElementById('hard-nav');nav.innerHTML=list.length===5&&list.every(q=>q.hard)?list.map((q,i)=>`<button data-jump="${i}" ${index===i?'style="border:2px solid #147a70"':''} aria-label="Difficult question ${i+1}">${i+1}</button>`).join(''):'';nav.querySelectorAll('[data-jump]').forEach(btn=>btn.onclick=()=>{index=Number(btn.dataset.jump);selected=null;checked=false;hint=false;render();});}

let list=bank,index=0,selected=null,checked=false,results={},hint=false;
const app=document.getElementById('app');function explanation(q){if(q.hard)return hardExplanation(q);const first=q.swap?'Second':'First',second=q.swap?'First':'Second';const featureA=[names[0],names[2],names[0],names[0],names[2],names[0]][q.t],featureB=[names[1],names[1],names[3],names[0],names[3],names[4]][q.t];return `<p><b>${first} letter:</b> ${featureA.map((x,i)=>`${q.letters[i]} = ${x}`).join('; ')}.</p><p><b>${second} letter:</b> ${featureB.map((x,i)=>`${q.letters[i+3]} = ${x}`).join('; ')}.</p><p>The target is <b>${description(q.t,q.a,q.b)}</b>, so its code is <b>${q.correct}</b>.</p>`}
function render(){renderHardNav();document.getElementById('bar').style.width=`${index/list.length*100}%`;if(index>=list.length){const score=list.filter(q=>results[bank.indexOf(q)]).length;app.innerHTML=`<div class="summary"><div class="eyebrow">Practice complete</div><strong>${score} / ${list.length}</strong><h2>Keep comparing one feature at a time.</h2><p>You can replay this set or choose another above.</p><button class="primary" id="restart">Try again</button></div>`;document.getElementById('restart').onclick=reset;return;}let q=list[index];app.innerHTML=`<div class="eyebrow">Question ${index+1} of ${list.length} · ${q.hard?'Difficult · '+q.title:types[q.t]}</div><p>Use the examples to find the two-letter code for the target picture.</p><div class="layout"><div class="examples">${q.ex.map(([a,b],i)=>`<div class="example">${q.hard?hardFigure(q,a,b,'ex'+i):figure(q.t,a,b,'ex'+i)}<span class="code">${q.code(a,b)}</span></div>`).join('')}</div><div><div class="eyebrow">Target picture</div><div class="target">${q.hard?hardFigure(q,q.a,q.b,'target'):figure(q.t,q.a,q.b,'target')}<span class="code">??</span></div><div class="options" role="group" aria-label="Answer choices">${q.options.map((x,i)=>`<button class="option ${selected===i?'selected':''} ${checked&&x===q.correct?'correct':''} ${checked&&selected===i&&x!==q.correct?'wrong':''}" data-choice="${i}" aria-pressed="${selected===i}" ${checked?'disabled':''}><small>${'ABCDE'[i]}</small>${x}</button>`).join('')}</div></div></div>${checked?`<div class="feedback" aria-live="polite"><h2>${q.options[selected]===q.correct?'Correct!':'The answer is '+q.correct+'.'}</h2>${explanation(q)}</div>`:hint?'<p class="hint">Compare two examples where only one feature changes. Which letter changes? Then use another pair to find the other letter’s job.</p>':''}<div class="actions"><button id="hint" ${checked?'disabled':''}>Show hint</button><button class="primary" id="submit" ${!checked&&selected===null?'disabled':''}>${checked?index===list.length-1?'See score':'Next question':'Check answer'}</button></div>`;app.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{selected=Number(btn.dataset.choice);render();});document.getElementById('hint').onclick=()=>{hint=true;render();};document.getElementById('submit').onclick=()=>{if(checked){index++;selected=null;checked=false;hint=false;}else{checked=true;results[bank.indexOf(q)]=q.options[selected]===q.correct;}render();};}
document.getElementById('difficult').onclick=()=>{document.getElementById('filter').value='hard';list=bank.filter(q=>q.hard);reset();};
function reset(){index=0;selected=null;checked=false;results={};hint=false;render();}document.getElementById('filter').onchange=e=>{list=e.target.value==='all'?bank:e.target.value==='hard'?bank.filter(q=>q.hard):bank.filter(q=>!q.hard&&q.t===Number(e.target.value));reset();};render();
</script></body></html>
